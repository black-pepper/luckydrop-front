name: Auto-merge Dependabot PRs

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dependabot
  cancel-in-progress: false

jobs:
  merge:
    name: Merge Dependabot PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find matching Dependabot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .base.ref == "dependency-updates" and .state == "open")][0].number')"

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "No open Dependabot PR targeting dependency-updates found."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found Dependabot PR #${pr_number}."
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Merge PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "Merge Dependabot PR ${PR_NUMBER}"

      - name: Open or update aggregate dependency PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr="$(gh pr list \
            --base develop \
            --head dependency-updates \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing_pr" ]; then
            echo "Aggregate dependency PR #${existing_pr} already exists."
          else
            gh pr create \
              --base develop \
              --head dependency-updates \
              --title "Update dependencies" \
              --body "Aggregated dependency updates from Dependabot. Review this PR to validate all dependency changes together."
          fi

      - name: Run aggregate dependency checks
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run quality-checks.yml --ref dependency-updates
