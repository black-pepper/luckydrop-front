name: Sync develop to dependency-updates

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-develop-to-dependency-updates
  cancel-in-progress: false

jobs:
  sync:
    name: Sync develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dependency-updates
        uses: actions/checkout@v4
        with:
          ref: dependency-updates
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync develop to dependency-updates
        run: |
          git fetch origin develop dependency-updates

          if git diff --quiet origin/develop origin/dependency-updates; then
            if [ "$(git rev-parse origin/develop)" = "$(git rev-parse origin/dependency-updates)" ]; then
              echo "dependency-updates already matches develop."
              exit 0
            fi

            echo "No pending changes. Resetting dependency-updates to develop."
            git reset --hard origin/develop
            git push --force-with-lease origin HEAD:dependency-updates
            exit 0
          fi

          if git merge-base --is-ancestor origin/develop origin/dependency-updates; then
            echo "dependency-updates already includes develop and has pending changes."
            exit 0
          fi

          git merge --no-ff origin/develop -m "Merge develop into dependency-updates"
          git push origin HEAD:dependency-updates
